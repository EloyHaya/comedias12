<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comedias 12</title>
    
    <!-- Favicon estándar y Apple Touch Icon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/comedias12favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/comedias12favicon.png">
    <meta name="apple-mobile-web-app-title" content="Comedias 12">
    <meta name="theme-color" content="#000000">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100dvh;
            object-fit: contain;
            display: block;
        }

        /* Ajuste para pantallas verticales de móvil */
        @media (max-aspect-ratio: 9/16), (max-width: 600px) {
            .hero {
                object-fit: cover;
                object-position: center 30%;
                width: 100vw;
                height: 100dvh;
            }
        }
    </style>
</head>
<body>
    <img src="/comedias12.jpg" alt="Comedias 12 - Eloy Haya" class="hero">
</body>
</html>
